[project]
name = "estimator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "epulido", email = "erika1390@gmail.com" }
]
requires-python = ">=3.13.9"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=3.18.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
estimator = "estimator:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
